<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>December Meetup — Pick the Spot</title>

    <style>
        :root {
            --bg: #FAF6EC;
            --green-deep: #163A2E;
            --green-mid: #2C5F4A;
            --gold: #C9982F;
            --gold-light: #E8C878;
            --ink: #1F2A24;
            --card-bg: #FFFFFF;
            --card-border: #E4DCC6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Georgia', 'Iowan Old Style', serif;
            padding: 28px 18px 60px;
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
        }

        header {
            text-align: left;
            margin-bottom: 24px;
            border-bottom: 3px solid var(--green-deep);
            padding-bottom: 18px;
        }

        header h1 {
            font-size: 30px;
            line-height: 1.15;
            margin: 0 0 8px;
            color: var(--green-deep);
            font-weight: 700;
        }

        header p {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14.5px;
            color: #55594F;
            line-height: 1.5;
        }

        .header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .total-count {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--green-deep);
        }

        .live-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4C9A6A;
            margin-right: 6px;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .live-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            color: #7A7D6F;
        }

        .status {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            color: var(--gold);
            margin-top: 10px;
            min-height: 16px;
        }

        .option {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
        }

        .option-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .option-name {
            font-size: 19px;
            font-weight: 700;
            color: var(--green-deep);
        }

        .option-meta {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            color: #6B6F63;
            margin-top: 4px;
            line-height: 1.5;
            position: relative;
            z-index: 2;
        }

        .option-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            position: relative;
            z-index: 2;
        }

        .vote-count {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            color: var(--green-mid);
            font-weight: 600;
        }

        .vote-btn {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--green-deep);
            color: #FCF8EE;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .vote-btn:hover {
            background: var(--green-mid);
        }

        .vote-btn:disabled {
            background: #D8D2BE;
            color: #8B8878;
            cursor: default;
        }

        .fill-bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: linear-gradient(90deg, #F3E6C4, #F3E6C400);
            z-index: 1;
            transition: width 0.4s ease;
        }

        .voted-tag {
            display: inline-block;
            background: var(--gold-light);
            color: var(--green-deep);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 11.5px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            margin-left: 8px;
        }

        .option.leading {
            border-color: var(--gold);
            box-shadow: 0 0 0 1px var(--gold);
        }

        .lead-tag {
            display: inline-block;
            font-size: 13px;
            margin-left: 6px;
        }

        .option.just-voted {
            animation: pop 0.35s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.015);
            }

            100% {
                transform: scale(1);
            }
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            color: #9A9887;
        }

        .reset-link {
            background: none;
            border: none;
            color: #9A9887;
            text-decoration: underline;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }
    </style>

</head>

<body>
    <div class="wrap">
        <header>
            <h1>Where are we going in December? 🎉</h1>
            <p>Vote for your top pick from the spots people suggested. Whoever gets the most votes wins — results update
                live for everyone who opens this.</p>
            <div class="header-bottom">
                <span class="total-count" id="totalCount">Loading…</span>
                <span class="live-label"><span class="live-dot"></span>live</span>
            </div>
            <div class="status" id="status"></div>
        </header>

        <div id="options"></div>

        <footer>
            One vote per person, please 🙏 &nbsp;·&nbsp; <button class="reset-link" id="resetBtn">reset my vote</button>
        </footer>
    </div>

    <script>
        // ---- CounterAPI config ----
        const CA_WORKSPACE = "december-hangout";
        const CA_TOKEN = "ut_ydqqEYkmfEvOBCiPCjrMKfxkmpPbNXeXZcW6DNJU";
        const CA_BASE = "https://api.counterapi.dev/v2/" + CA_WORKSPACE + "/";

        const OPTIONS = [
            { id: "omu-resort", name: "Omu Resort", meta: "Bogije, Ibeju-Lekki · ~₦33K/head (gate + Uber from Oshodi) · Big fun park, farthest option" },
            { id: "takwa-bay", name: "Takwa Bay Beach", meta: "Lekki · ₦5K entry, +₦5K boat / +₦20K tent · Beach + boat cruise" },
            { id: "lufasi-park", name: "Lufasi Park", meta: "Majek, 1st Gate, Lekki-Epe Expy · ₦3,500/head · Nature & adventure, easy drive" },
            { id: "jhalobia-park", name: "Jhalobia Recreation Park", meta: "Airport Road, Ikeja · ~₦5,000/head · Outdoorsy, swings, easy drive" },
            { id: "hakuna-matata", name: "Hakuna Matata Theme Park", meta: "Eko Atlantic, VI · ~₦18K–20K/head · Biggest inflatable park, wet & dry zones (Wed–Sun)" },
            { id: "rosellas-park", name: "Rosellas Park", meta: "Lagos · Fee not confirmed yet · Rides & games" }
        ];

        let votes = {};
        let myVote = null;
        const statusEl = document.getElementById('status');
        const container = document.getElementById('options');
        const LOCAL_KEY = 'december_meetup_my_vote';

        function setStatus(msg, isError) {
            statusEl.textContent = msg;
            statusEl.style.color = isError ? '#B23A3A' : '#C9982F';
        }

        function extractCount(json) {
            try {
                const d = json.data || json;
                if (typeof d.up_count === 'number') return d.up_count;
                if (typeof d.value === 'number') return d.value;
                if (typeof d.count === 'number') return d.count;
            } catch (e) { }
            return 0;
        }

        async function caGet(name) {
            const res = await fetch(CA_BASE + name, {
                headers: { "Authorization": "Bearer " + CA_TOKEN }
            });
            if (!res.ok) throw new Error("get failed " + res.status);
            const json = await res.json();
            return extractCount(json);
        }

        async function caUp(name) {
            const res = await fetch(CA_BASE + name + "/up", {
                headers: { "Authorization": "Bearer " + CA_TOKEN }
            });
            if (!res.ok) throw new Error("up failed " + res.status);
            const json = await res.json();
            return extractCount(json);
        }

        async function caDown(name) {
            const res = await fetch(CA_BASE + name + "/down", {
                headers: { "Authorization": "Bearer " + CA_TOKEN }
            });
            if (!res.ok) throw new Error("down failed " + res.status);
            const json = await res.json();
            return extractCount(json);
        }

        async function loadVotes() {
            const loaded = {};
            await Promise.all(OPTIONS.map(async opt => {
                try {
                    loaded[opt.id] = await caGet(opt.id);
                } catch (e) {
                    loaded[opt.id] = votes[opt.id] || 0;
                }
            }));
            return loaded;
        }

        function loadMyVote() {
            try {
                return localStorage.getItem(LOCAL_KEY);
            } catch (e) {
                return null;
            }
        }

        function saveMyVote(id) {
            try {
                if (id === null) localStorage.removeItem(LOCAL_KEY);
                else localStorage.setItem(LOCAL_KEY, id);
            } catch (e) { }
        }

        function render(justVotedId) {
            const total = Object.values(votes).reduce((a, b) => a + b, 0);
            const totalEl = document.getElementById('totalCount');
            totalEl.textContent = total === 0 ? 'No votes yet' : (total + ' vote' + (total === 1 ? '' : 's') + ' so far');

            const maxVotes = Math.max(0, ...OPTIONS.map(o => votes[o.id] || 0));
            const sorted = [...OPTIONS].sort((a, b) => (votes[b.id] || 0) - (votes[a.id] || 0));

            container.innerHTML = '';
            sorted.forEach(opt => {
                const count = votes[opt.id] || 0;
                const pct = total > 0 ? Math.round((count / total) * 100) : 0;
                const isLeading = maxVotes > 0 && count === maxVotes;
                const div = document.createElement('div');
                div.className = 'option' + (isLeading ? ' leading' : '') + (justVotedId === opt.id ? ' just-voted' : '');
                div.innerHTML = `
      <div class="fill-bar" style="width:${pct}%"></div>
      <div class="option-top">
        <span class="option-name">${opt.name}${isLeading ? '<span class="lead-tag">👑</span>' : ''}${myVote === opt.id ? '<span class="voted-tag">your vote</span>' : ''}</span>
      </div>
      <div class="option-meta">${opt.meta}</div>
      <div class="option-bottom">
        <span class="vote-count">${count} vote${count === 1 ? '' : 's'}${total > 0 ? ' · ' + pct + '%' : ''}</span>
        <button class="vote-btn" data-id="${opt.id}" ${myVote ? 'disabled' : ''}>
          ${myVote === opt.id ? 'Voted ✓' : 'Vote'}
        </button>
      </div>
    `;
                container.appendChild(div);
            });

            container.querySelectorAll('.vote-btn').forEach(btn => {
                btn.addEventListener('click', () => castVote(btn.getAttribute('data-id')));
            });
        }

        async function castVote(id) {
            if (myVote) return;
            setStatus('Saving your vote...');
            try {
                const newCount = await caUp(id);
                votes[id] = newCount;
                myVote = id;
                saveMyVote(id);
                render(id);
                setStatus('Vote saved 🎉');
            } catch (e) {
                setStatus('Could not save your vote — check your connection and try again.', true);
            }
        }

        document.getElementById('resetBtn').addEventListener('click', async () => {
            if (!myVote) { setStatus('You have not voted yet.'); return; }
            try {
                const newCount = await caDown(myVote);
                votes[myVote] = newCount;
                myVote = null;
                saveMyVote(null);
                render();
                setStatus('Vote reset — pick again anytime.');
            } catch (e) {
                setStatus('Could not reset — try again.', true);
            }
        });

        async function refreshVotes() {
            try {
                const latest = await loadVotes();
                const changed = OPTIONS.some(opt => (latest[opt.id] || 0) !== (votes[opt.id] || 0));
                if (changed) {
                    votes = latest;
                    render();
                }
            } catch (e) {
                // silent fail on background refresh
            }
        }

        (async function init() {
            setStatus('Loading votes...');
            myVote = loadMyVote();
            votes = await loadVotes();
            render();
            setStatus('');
            setInterval(refreshVotes, 4000);
        })();
    </script>
</body>

</html>
